name: Build CrayonShell

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production files
        run: npm run build

      - name: Verify WebView2 output files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "dist/index.html",
            "dist/crayonshell.iife.js",
            "dist/crayonshell.css"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Build artifact missing: $file"
            }
          }
